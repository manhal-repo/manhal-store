Name: "Al-Manhal Cleaner"
Summary: "تطبيق أندرويد (Kotlin + Jetpack Compose) لتنظيف الهاتف وإدارة التطبيقات."
Description: |-
  تطبيق أندرويد (Kotlin + Jetpack Compose) لتنظيف الهاتف وإدارة التطبيقات. مجاني بإعلانات، مع شراء لمرة واحدة لإزالتها.
  اللغات: العربية · English · Français (حسب لغة النظام، أو من زر 🌐 داخل التطبيق).

  الإعلانات (AdMob)
  • إعلان بيني بعد انتهاء كل مهمة (إجراء على التطبيقات، فحص الملفات المكررة/الحذف، فحص الإعلانات/الأمان).
  • بانر تكيّفي أسفل الواجهة.
  • نافذة موافقة الخصوصية (UMP) تظهر تلقائياً عند الحاجة، وزر «خيارات الخصوصية» داخل نافذة ⭐.
  • المفاتيح الحالية مفاتيح اختبار رسمية. استبدلها في app/build.gradle.kts (الأسطر TODO) بمفاتيحك من AdMob.
  • لتحديد فاصل أدنى بين الإعلانات عدّل MIN_INTERVAL_MS في AdManager.kt (الافتراضي 0 = بعد كل مهمة).

  الشراء (إزالة الإعلانات)
  منتج «مرة واحدة» غير مستهلك، وليس اشتراكاً دورياً.
  1. Play Console ← Monetize ← Products ← One-time products ← Create.
  2. المعرّف: remove_ads · السعر: 1.00 USD (يتحول تلقائياً لباقي العملات).
  3. اختبر عبر Internal testing + حساب مختبِر مرخّص (License testers). الشراء لا يعمل في APK مثبّت يدوياً.

  النشر على Google Play (ملاحظات مهمة)
  • منذ 31 أغسطس 2026 يجب أن يستهدف التطبيق API 36، وأن تكون مكتبة Billing بالإصدار 8 أو أحدث (المشروع يستخدم 8.3.0).
    لذلك ارفع compileSdk وtargetSdk إلى 36 (مع تحديث AGP/Gradle/Kotlin ومنصة SDK 36) قبل الرفع.
  • مكتبة play-services-ads هنا 23.6.0 لتوافق compileSdk 34؛ عند الرفع إلى 36 حدّثها لآخر إصدار.
  • أذونات QUERY_ALL_PACKAGES وMANAGE_EXTERNAL_STORAGE تتطلب تبريراً وقد ترفضها Google Play، والحذف الصامت بالروت قد يخالف السياسات.
    للتوزيع المباشر (APK / F-Droid) لا مشكلة، لكن الشراء داخل التطبيق يحتاج Google Play.
  • أضف رابط سياسة الخصوصية، وأكمل نموذج Data safety (الإعلانات + الشراء).

  البناء
  افتح المجلد في Android Studio أو نفّذ gradle assembleDebug ثم ثبّت app/build/outputs/apk/debug/app-debug.apk.

  درع الإعلانات (التقاط الإعلانات)
  تبويب «الإعلانات» ← «الالتقاط». يعتمد على خدمة إمكانية وصول تفعّلها يدوياً (لا تقرأ محتوى الشاشة، فقط اسم التطبيق والصنف للنافذة).
  • الالتقاط: يسجل أي نشاط إعلان (AdActivity وغيره من شبكات الإعلان) يظهر فوق تطبيق آخر، أو نافذة عائمة من تطبيق ذي مكوّنات إعلانية.
  • بدون روت: يضغط «رجوع» لإغلاق نشاط الإعلان (قد يظهر لحظة قصيرة)، والنوافذ العائمة تُسجَّل ويصلك إشعار يفتح صفحة سحب إذن العرض فوق التطبيقات.
  • مع الروت: إيقاف قسري للتطبيق + appops SYSTEM_ALERT_WINDOW deny.
  • قائمة الحظر الدائم: تطبيق محظور تُغلق إعلاناته حتى لو ظهرت أثناء استخدامه.
  • حماية هذا التطبيق: setHideOverlayWindows (أندرويد 12+) وfilterTouchesWhenObscured: لا تظهر أي نافذة عائمة فوقه ولا تُقبل اللمسات عند تغطيته.
  • أندرويد 13+ عند التثبيت اليدوي: إن كان مفتاح الخدمة رمادياً فمن معلومات التطبيق ← ⋮ ← السماح بالإعدادات المقيّدة.
  • Google Play تقيّد استخدام خدمات إمكانية الوصول لغير ذوي الاحتياجات الخاصة وتتطلب تصريحاً؛ قد يُرفض التطبيق بسببها.

  شاشة البداية وإعلان فتح التطبيق
  • شاشة البداية (core-splashscreen): درع المنهل أبيض على خلفية خضراء، وتعمل على أندرويد 8 وما فوق (ومن 12 بالشكل الرسمي للنظام).
  • إعلان الفتح (App Open): يظهر عند التشغيل البارد فقط (شاشة البداية تنتظره 3 ثوانٍ كحد أقصى ثم يكمل التطبيق بدونه)، وعند العودة بعد غياب 5 دقائق أو أكثر.
    لا يظهر عند العودة السريعة من شاشات الإعدادات في الوضع اليدوي، ولا للمشتري.
  • مفتاح الوحدة admobAppOpenId في app/build.gradle.kts (الحالي مفتاح اختبار).
