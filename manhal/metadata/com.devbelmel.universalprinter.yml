Name: "Universal Printer"
Summary: "اطبع من أندرويد إلى أي طابعة: شبكة أو USB أو بلوتوث أو حاسوب ويندوز"
Description: |-
  خدمة طباعة لأندرويد تدعم بروتوكولات IPP وLPR وRAW وFTP وSMB، والاتصال عبر USB وبلوتوث وWi-Fi Direct، مع اكتشاف الطابعات تلقائياً في الشبكة وصفحة اختبار وسجل للطباعة. يمكن ربطه ببرنامج UniversalPrintServer على ويندوز لتحويل الحاسوب إلى خادم طباعة.
