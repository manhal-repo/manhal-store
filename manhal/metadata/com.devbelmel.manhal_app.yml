Name: "المنهل"
Summary: "دليل توافق قطع غيار الهواتف مع متجر منتجات وسلة طلبات"
Description: |-
  اختر نوع القطعة ثم الشركة ثم الموديل لتعرف الأجهزة المتوافقة معها. يتضمن متجراً لعرض المنتجات بالصور وإضافتها إلى السلة وإرسال الطلب، إضافة إلى أدوات وبرامج الصيانة.
