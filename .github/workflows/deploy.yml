name: Deploy Manhal Store

on:
  push:
    branches:
      - main
    paths:
      - "manhal/**"
      - "public/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F-Droid tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Setup Android build tools
        run: |
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL "$SDK_URL" -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdline-tools"/* "$SDK_ROOT/cmdline-tools/latest/"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.0"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Validate Android repository
        run: |
          test -d manhal/metadata || { echo "::error::Directory manhal/metadata does not exist"; exit 1; }
          mkdir -p manhal/repo

          test -f manhal/config.yml || { echo "::error::Missing manhal/config.yml"; exit 1; }
          test -f manhal/allowed-packages.txt || { echo "::error::Create manhal/allowed-packages.txt with one approved package ID per line"; exit 1; }

          grep -Ev '^[[:space:]]*(#|$)' manhal/allowed-packages.txt \
            | tr -d '\r' \
            | sort -u > "$RUNNER_TEMP/allowed-packages.txt"

          test -s "$RUNNER_TEMP/allowed-packages.txt" || { echo "::error::The package allowlist is empty"; exit 1; }

          while IFS= read -r package; do
            if ! printf '%s\n' "$package" | grep -Eq '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'; then
              echo "::error::Invalid package ID: $package"
              exit 1
            fi
          done < "$RUNNER_TEMP/allowed-packages.txt"

      - name: Remove unapproved APKs and metadata
        run: |
          set -eu
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found in build-tools"
            exit 1
          fi

          find manhal/repo -maxdepth 1 -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            package="$("$AAPT" dump badging "$apk" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            if [ -z "$package" ]; then
              echo "::warning::Could not read package ID from $apk; removing it"
              rm -f "$apk"
              continue
            fi
            if ! grep -Fxq "$package" "$RUNNER_TEMP/allowed-packages.txt"; then
              echo "Removing unapproved APK: $package"
              rm -f "$apk"
            fi
          done

          find manhal/metadata -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' dir; do
            package="$(basename "$dir")"
            if ! grep -Fxq "$package" "$RUNNER_TEMP/allowed-packages.txt"; then
              echo "Removing unapproved metadata: $package"
              rm -rf "$dir"
            fi
          done

          python - <<'PY'
          import subprocess, os, sys
          from pathlib import Path

          allowed_file = Path(os.environ['RUNNER_TEMP']) / 'allowed-packages.txt'
          allowed = {line.strip() for line in allowed_file.read_text().splitlines() if line.strip()}

          aapt = None
          for root, _, files in os.walk(os.environ['ANDROID_HOME'] + '/build-tools'):
              if 'aapt' in files:
                  aapt = os.path.join(root, 'aapt')
                  break
          if not aapt:
              print("::error::aapt not found")
              sys.exit(1)

          apk_dir = Path('manhal/repo')
          found_packages = set()
          for apk in apk_dir.glob('*.apk'):
              try:
                  out = subprocess.check_output(
                      [aapt, 'dump', 'badging', str(apk)],
                      stderr=subprocess.DEVNULL, text=True
                  )
                  for line in out.splitlines():
                      if line.startswith("package: name='")):
                          pkg = line.split("'")[1]
                          found_packages.add(pkg)
                          break
              except Exception:
                  pass

          missing = allowed - found_packages
          if missing:
              print(f"::error::No APK found for approved packages: {sorted(missing)}")
              sys.exit(1)
          print(f"All {len(allowed)} approved packages have APKs.")
          PY

      - name: Prepare F-Droid configuration
        run: |
          cd manhal
          fdroid --version
          fdroid update --help >/dev/null

      - name: Build fresh F-Droid index
        run: |
          set -eu
          cd manhal
          rm -f repo/index-v1.json repo/index-v1.jar
          rm -f repo/index-v2.json repo/index-v2.jar
          rm -f repo/entry.json repo/entry.jar
          fdroid update -c test -s repo/index-v1.json || {
            echo "::error::F-Droid did not generate repo/index-v1.json"
            exit 1
          }

      - name: Verify indexed package IDs
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          allowed_file = Path(os.environ['RUNNER_TEMP']) / 'allowed-packages.txt'
          allowed = {line.strip() for line in allowed_file.read_text().splitlines() if line.strip()}

          index_path = Path("manhal/repo/index-v1.json")
          data = json.loads(index_path.read_text())
          apps = data.get("apps", {})
          actual = set(apps.keys())

          if not actual:
              raise SystemExit("ERROR: F-Droid index contains no apps")

          missing = allowed - actual
          unexpected = actual - allowed

          if missing:
              raise SystemExit(f"ERROR: Approved packages missing from index: {sorted(missing)}")
          if unexpected:
              raise SystemExit(f"ERROR: Unapproved packages in index: {sorted(unexpected)}")

          print(f"Verified {len(actual)} approved packages.")
          PY

      - name: Install website dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Include Android repository in website
        run: |
          mkdir -p dist/repo
          cp -a manhal/repo/. dist/repo/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4