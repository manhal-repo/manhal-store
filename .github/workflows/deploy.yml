name: Build & Deploy

on:
  workflow_dispatch:   # manual only: Actions tab > Run workflow, or: gh workflow run <file>
  push:
    branches: [main]
    paths:
      - "manhal/**"
      - "public/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fdroidserver via pip
        run: |
          pip install --upgrade pip
          pip install fdroidserver

      # ملاحظة: لا تحتاج Android SDK هنا لأن fdroid update لا يبني التطبيقات،
      # فقط يفهرس APKs الموجودة مسبقاً في manhal/repo/
      # إذا كنت تبني التطبيقات لاحقاً ستحتاج إضافة setup لـ Android SDK.

      - name: Prepare keystore + config
        working-directory: manhal
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Missing secrets KEYSTORE_B64 / KEYSTORE_PASS / KEY_ALIAS"
            exit 1
          fi

          umask 077
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks

          # كتابة config.yml بدون sed (أنظف وأأمن)
          cat > config.yml <<CFG
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          sdk_path: ${ANDROID_HOME:-/usr/local/lib/android/sdk}
          repo_name: "My App Store"
          repo_description: "My private F-Droid repository"
          archive_older: 0
          keystore: keystore.jks
          repo_keyalias: ${KEY_ALIAS}
          keystorepass: ${KEYSTORE_PASS}
          keypass: ${KEYSTORE_PASS}
          keydname: "CN=MyRepo, OU=Apps, O=Me, C=US"
          CFG

          chmod 600 config.yml
          # تأكد أن الملف سليم
          echo "--- config.yml ---"
          sed 's/keystorepass:.*/keystorepass: ***/; s/keypass:.*/keypass: ***/' config.yml

      - name: Build F-Droid index
        working-directory: manhal
        run: |
          set -eu
          mkdir -p repo metadata

          # fdroid يرفض الملفات الفارغة مثل .gitkeep
          find repo -type f -size 0 -delete

          fdroid update -c

          # الموقع والتطبيق يقرآن index-v1.json؛ استخرجه من الـ jar إن لزم
          if [ ! -f repo/index-v1.json ] && [ -f repo/index-v1.jar ]; then
            unzip -o repo/index-v1.jar index-v1.json -d repo
          fi

          test -f repo/index-v1.json || {
            echo "::error::index-v1.json was not generated"
            ls -la repo
            exit 1
          }

          python3 - <<'PY'
          import json
          d = json.load(open('repo/index-v1.json'))
          apps = d.get('apps', {})
          if not apps:
              raise SystemExit("ERROR: index contains no apps")
          print(f"apps in index = {len(apps)}")
          PY

          ls -la repo | head -40
          ls -d repo/icons* 2>/dev/null || true

      - name: Verify no secrets leaked
        working-directory: manhal
        run: |
          set -eu
          # لا يجب أن يظهر الـ keystore أو الـ config في الـ dist
          if [ -f keystore.jks ]; then
            rm -f keystore.jks
            echo "keystore.jks removed after signing"
          fi
          rm -f config.yml
          # تأكد أن ملفات التوقيع لا تُنشر
          find . -name '*.jks' -delete || true

      - name: Build website
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json not found, falling back to npm install"
            npm install
          fi
          npm run build

      - name: Merge repo into site
        run: |
          set -eu
          mkdir -p dist/repo
          cp -a manhal/repo/. dist/repo/
          # تأكد أننا لا ننشر أي شيء حساس
          find dist -name '*.jks' -delete || true
          find dist -name 'config.yml' -delete || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4