name: Build & Deploy
on:
  workflow_dispatch:   # manual only: Actions tab > Run workflow, or: gh workflow run <file>
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install fdroidserver via pip
        run: pip install --upgrade pip && pip install fdroidserver
      - name: Prepare keystore + config
        working-directory: fdroid
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          cat > config.yml <<CFG
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          sdk_path: $ANDROID_HOME
          repo_name: "My App Store"
          repo_description: "My private F-Droid repository"
          archive_older: 0
          keystore: keystore.jks
          repo_keyalias: $KEY_ALIAS
          keystorepass: $KEYSTORE_PASS
          keypass: $KEYSTORE_PASS
          keydname: "CN=MyRepo, OU=Apps, O=Me, C=US"
          CFG
          sed -i 's/^          //' config.yml
          chmod 600 config.yml
      - name: Build F-Droid index
        working-directory: fdroid
        run: |
          mkdir -p repo metadata
          find repo -type f -size 0 -delete   # fdroid rejects empty files such as .gitkeep
          fdroid update -c
          ls -la repo | head -30
      - name: Build website
        run: npm install && npm run build
      - name: Merge repo into site
        run: cp -r fdroid/repo dist/repo
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
