name: Deploy Manhal Store

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install fdroidserver

      - name: Prepare keystore and config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::KEYSTORE_B64 secret is missing!"
            exit 1
          fi
          
          # اكتشاف اسم المجلد تلقائياً
          if [ -d "manhal" ]; then
            echo "STORE_DIR=manhal" >> $GITHUB_ENV
          elif [ -d "fdroid" ]; then
            echo "STORE_DIR=fdroid" >> $GITHUB_ENV
          else
            echo "::error::Neither 'manhal' nor 'fdroid' folder exists in the repository!"
            echo "Did you commit the folder to git?"
            ls -la
            exit 1
          fi

          cd "$STORE_DIR"
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          chmod 600 keystore.jks

          cat > config.yml <<CFG
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo
          repo_name: "Manhal Store"
          repo_description: "Manhal App Store"
          archive_older: 0
          keystore: keystore.jks
          repo_keyalias: ${{ secrets.KEY_ALIAS }}
          keystorepass: ${{ secrets.KEYSTORE_PASS }}
          keypass: ${{ secrets.KEYSTORE_PASS }}
          CFG
          chmod 600 config.yml

      - name: Build F-Droid index
        run: |
          set -eu
          cd "$STORE_DIR"
          mkdir -p repo metadata
          find repo -type f -size 0 -delete
          
          fdroid update -c
          
          if [ ! -f repo/index-v1.json ] && [ -f repo/index-v1.jar ]; then
            unzip -o repo/index-v1.jar index-v1.json -d repo
          fi
          test -f repo/index-v1.json || { echo "::error::index-v1.json missing"; ls -la repo; exit 1; }
          
          python3 -c "import json; d=json.load(open('repo/index-v1.json')); print('apps =', len(d.get('apps', {})))"

      - name: Cleanup secrets
        run: |
          cd "$STORE_DIR"
          rm -f keystore.jks config.yml
          find . -name '*.jks' -delete || true

      - name: Install website dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build website
        run: npm run build

      - name: Merge repo into site
        run: |
          mkdir -p dist/repo
          cp -a "$STORE_DIR/repo/." dist/repo/
          find dist -name '*.jks' -delete || true
          find dist -name 'config.yml' -delete || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4